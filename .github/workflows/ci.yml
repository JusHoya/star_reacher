# CI (PRD section 7 matrix; Phase 1 exit criteria 1, 5, 6, 7; Phase 2
# exit criterion 8; Phase 5 exit criteria 3 and 6; Phase 8 exit criteria 2,
# 3, and 5). A bare "exit criterion N" below means Phase 1; every other phase
# is named.
# Honesty rule: no continue-on-error anywhere — a red gate is a red build.
name: ci

on:
  push:
    # Phase branches get the full matrix before merge: the sprint methodology
    # gates each phase merge on green CI, so waiting for a PR event would
    # serialize verification behind PR plumbing.
    branches: [main, 'phase-*']
    # Version tags drive the Phase 8 exit-criterion-5 release job (four-platform
    # wheels built and verify-smoked). Tags never touch main's branch matrix.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Exit criteria 1 and 7: the wheel builds and installs on all four legs,
  # the Python suite passes, and `star verify --quick` finishes under 60 s
  # with a PASS verdict. Criterion 7 targets the ARM leg (Pi 5 proxy), but
  # the timing gate is enforced on every leg — a slower leg failing it is
  # information, not noise.
  build-test:
    strategy:
      # All legs report even when one fails, so a platform-specific defect
      # is visible in a single CI round-trip.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package (builds the native core)
        run: pip install .
      - name: Install the pandas/parquet/rl/ml extras (one leg only)
        # Phase 5 exit criterion 3 and Phase 7 exit criteria 3-4 are all
        # "CI-gated" the same way: the pandas/parquet, gymnasium (rl), and
        # onnxruntime (ml) suites are importorskip-gated and would otherwise
        # never execute, so exactly one leg installs the documented extras to
        # run them (test_space_env.py needs gymnasium; test_onnx_gnc.py needs
        # onnxruntime). The other three legs stay extras-free so the
        # bare-install path (loader and CSV/NPZ export, and the mc/regression
        # layer, all with no optional dependencies) keeps coverage.
        if: matrix.os == 'ubuntu-24.04'
        run: pip install '.[pandas,parquet,rl,ml]'
      - name: Install test dependencies
        run: pip install pytest
      - name: Run Python test suite
        # Serial on purpose: no -n auto (project resource-containment rule,
        # and parallel workers would blur determinism-gate diagnostics).
        run: pytest tests/python -q
      - name: star verify --quick (timed gate)
        # Inline wrapper instead of `time`/`timeout` shell tools so the same
        # step runs identically on POSIX and Windows runners. Fails on:
        # nonzero exit, wall time >= 60 s, or a missing PASS verdict.
        shell: python
        run: |
          import subprocess
          import sys
          import time

          start = time.monotonic()
          proc = subprocess.run(
              ["star", "verify", "--quick"],
              capture_output=True,
              text=True,
          )
          elapsed = time.monotonic() - start
          output = proc.stdout + proc.stderr
          print(output)
          print(f"wall time: {elapsed:.1f} s")
          if proc.returncode != 0:
              sys.exit(f"star verify --quick exited {proc.returncode}")
          if elapsed >= 60.0:
              sys.exit(f"star verify --quick took {elapsed:.1f} s (gate: < 60 s)")
          if "VERIFY: PASS" not in output:
              sys.exit("output does not contain 'VERIFY: PASS'")
      # Phase 7 exit criterion 1, literal clause: the 256-run LHS sweep on 8
      # workers finishes 256/256 `status: success`, and re-executing one
      # manifest entry via `star run` with its recorded seed and overrides
      # reproduces its logged SHA-256. The mc engine, its per-run seeding, and
      # the worker-count-independence of the result are unit-checked by the
      # pytest suite on every leg (test_mc.py, test_run_overrides.py); this one
      # leg gates the literal 8-worker/256-run number and the CLI re-execution
      # round trip. The sweep runs on committed gravity data (no fetched
      # ephemeris) in a couple of seconds.
      - name: star mc 256-run/8-worker sweep + re-execution (criterion 1)
        if: matrix.os == 'ubuntu-24.04'
        shell: python
        run: |
          import hashlib
          import json
          import subprocess
          import sys

          out = "mc-c1"
          proc = subprocess.run(
              ["star", "mc", "missions/leo_gravity_8x8_sweep.toml",
               "--workers", "8", "--outdir", out, "--force"],
              capture_output=True, text=True,
          )
          print(proc.stdout + proc.stderr)
          if proc.returncode != 0:
              sys.exit(f"star mc exited {proc.returncode}")
          manifest = json.load(open(f"{out}/manifest.json"))
          runs = manifest["runs"]
          n_ok = sum(r["status"] == "success" for r in runs)
          if len(runs) != 256 or n_ok != 256:
              sys.exit(f"expected 256/256 success, got {n_ok}/{len(runs)}")
          entry = runs[42]
          base = "missions/" + manifest["sweep"]["mission"]
          sets = []
          for key, value in entry["overrides"].items():
              literal = repr(value) if isinstance(value, float) else str(value)
              sets += ["--set", f"{key}={literal}"]
          rerun = subprocess.run(
              ["star", "run", base, "--seed", str(entry["seed"]), *sets,
               "-o", "mc-c1-reexec", "--force"],
              capture_output=True, text=True,
          )
          print(rerun.stdout[-400:] + rerun.stderr[-400:])
          if rerun.returncode != 0:
              sys.exit(f"re-execution star run exited {rerun.returncode}")
          digest = hashlib.sha256(open("mc-c1-reexec/run.srlog", "rb").read()).hexdigest()
          if digest != entry["log_sha256"]:
              sys.exit(f"re-execution hash {digest} != manifest {entry['log_sha256']}")
          print(f"criterion 1 OK: 256/256 success; run 42 re-execution matches {digest}")
      # Phase 7 exit criterion 2, two-key half: the CI gate that rejects a
      # golden change not carried through the diff-summary tooling. It
      # recomputes each hash-gated golden file's SHA-256 and fails if it
      # differs from the value the manifest records, so a hand-edited golden
      # (or one regenerated without updating its manifest) is a red build.
      # Stdlib-only and platform-independent, so it runs on one leg.
      - name: Golden-manifest integrity gate (criterion 2 two-key path)
        if: matrix.os == 'ubuntu-24.04'
        run: python scripts/check_golden_manifests.py
      # Phase 2 exit criterion 8, per-leg half: propagate the reference
      # mission and publish this leg's final truth state at full precision
      # (float.hex()) for the cross-platform-divergence job below.
      - name: Propagate the reference mission (criterion 8)
        shell: bash
        run: star run missions/twobody_leo.toml -o "$RUNNER_TEMP/c8-run"
      - name: Extract the final truth state
        shell: bash
        run: >-
          python scripts/cross_platform_divergence.py extract
          --srlog "$RUNNER_TEMP/c8-run/run.srlog"
          --leg "${{ matrix.os }}"
          --out finalstate/finalstate.json
      - name: Upload the final-state artifact
        uses: actions/upload-artifact@v4
        with:
          name: finalstate-${{ matrix.os }}
          path: finalstate/finalstate.json
          if-no-files-found: error
      # Phase 6 widening of criterion 8, per-leg half. The final-state
      # extraction above samples truth.r_m and truth.v_mps of one mission,
      # which the byte-determinism pass showed are exactly the channels that
      # stay bit-identical in every point-mass mission; this step publishes
      # EVERY channel of every gated mission so the libm-bearing surface
      # (sensors, nav, env, guidance) is compared too. The two-body run above
      # is reused rather than repeated.
      - name: Propagate the channel-gate missions
        shell: bash
        run: |
          set -euo pipefail
          for m in leo_attitude_gnc leo_ekf_consistency leo_optical_nav ascent_leo_gnc; do
            star run "missions/$m.toml" -o "$RUNNER_TEMP/xp-$m"
            python scripts/cross_platform_divergence.py extract-channels \
              --srlog "$RUNNER_TEMP/xp-$m/run.srlog" \
              --mission "$m" --leg "${{ matrix.os }}" \
              --out "xplat/channels-$m.json"
          done
          python scripts/cross_platform_divergence.py extract-channels \
            --srlog "$RUNNER_TEMP/c8-run/run.srlog" \
            --mission twobody_leo --leg "${{ matrix.os }}" \
            --out xplat/channels-twobody_leo.json
      - name: Upload the channel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xplat-${{ matrix.os }}
          path: xplat/
          if-no-files-found: error

  # Phase 2 exit criterion 8, aggregation half: the cross-platform
  # final-state divergence on the two-body reference propagation is
  # measured across all four legs, published as a commit status readable
  # without authentication, and gated against the committed record
  # tests/golden/determinism/cross_platform.toml (divergence definition
  # and gate rules in scripts/cross_platform_divergence.py). Bootstrap:
  # the record is committed as pending-first-measurement, so the FIRST run
  # of this job fails by design; the maintainer transcribes the measured
  # value from the commit status into the record (procedure in the
  # record's comments) and the rerun goes green.
  cross-platform-divergence:
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: finalstate-*
          path: finalstates
      - name: Measure the max pairwise relative divergence
        id: measure
        run: |
          # pipefail so a measure failure fails this step directly instead of
          # relying on the downstream grep/gate steps to notice the gap.
          set -o pipefail
          python scripts/cross_platform_divergence.py measure \
            --dir finalstates --expect-legs 4 \
            --bound 1e-9 --out measurement.json | tee measure.log
          grep -E '^(max_rel|status_state)=' measure.log >> "$GITHUB_OUTPUT"
      - name: Publish the measurement as a commit status
        # A commit status (unlike job logs) is readable without
        # authentication on a public repository, which is how the measured
        # value reaches the maintainer machine (no gh CLI there). Skipped
        # on pull_request events, whose token cannot write statuses from
        # forks; the gate step below still enforces the bound there.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.measure.outputs.status_state }}
          MAX_REL: ${{ steps.measure.outputs.max_rel }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"determinism/cross-platform\",\"description\":\"max_rel=$MAX_REL (bound 1e-9, 4 legs)\",\"target_url\":\"$RUN_URL\"}"
      - name: Gate against the committed record
        run: >-
          python scripts/cross_platform_divergence.py gate
          --measurement measurement.json
          --record tests/golden/determinism/cross_platform.toml
          --bound 1e-9
      # Phase 6 widening, aggregation half. Runs after the final-state gate
      # so a regression in the two-body control is reported first: if the
      # basic-operation surface has moved, every channel number below is
      # suspect. The tolerance defaults to the value derived in the script
      # and is not restated here, so the derivation has exactly two homes
      # (the script and the committed record) and the gate fails if they
      # disagree.
      - uses: actions/download-artifact@v4
        with:
          pattern: xplat-*
          path: xplat
      - name: Measure the channel-level divergence
        id: measure_channels
        run: |
          set -o pipefail
          python scripts/cross_platform_divergence.py measure-channels \
            --dir xplat --expect-legs 4 \
            --out channel-measurement.json | tee channels.log
          grep -E '^(channel_max_rel|channel_status_state)=' channels.log >> "$GITHUB_OUTPUT"
      - name: Publish the channel measurement as a commit status
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.measure_channels.outputs.channel_status_state }}
          MAX_REL: ${{ steps.measure_channels.outputs.channel_max_rel }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"determinism/cross-platform-channels\",\"description\":\"channel_max_rel=$MAX_REL (tol 3.256e-10, 5 missions, 4 legs)\",\"target_url\":\"$RUN_URL\"}"
      - name: Gate the channel-level divergence
        run: >-
          python scripts/cross_platform_divergence.py gate-channels
          --measurement channel-measurement.json
          --record tests/golden/determinism/cross_platform.toml

  # C++ unit tests (doctest via CTest) with warnings-as-errors. A plain
  # configure is used rather than a preset so this job has no coupling to
  # preset binary-directory naming; the determinism flags are applied
  # unconditionally by the core CMakeLists, not by any preset.
  # -Wshadow is listed explicitly because -Wall -Wextra does not imply it:
  # four name-shadowing defects reached the Phase 6 branch and were caught
  # only by MSVC /W4 (C4457/C4458), which no CI job builds. GCC diagnoses
  # the same four sites once the flag is present.
  cpp-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure (warnings as errors)
        run: >-
          cmake -S . -B build/ci
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wshadow -Werror"
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Run doctest suite
        run: ctest --test-dir build/ci --output-on-failure

  # Exit criterion 5, and Phase 8 exit criterion 2's build and reproducibility
  # clauses: both PDFs build on a clean clone, the FR-29 chapter lint is green,
  # the PDFs are uploaded as artifacts, and two consecutive doc builds under
  # SOURCE_DATE_EPOCH are byte-identical. The build is warning-clean, not merely
  # error-clean: `star docs` scans each LaTeX log and fails on any Warning-tagged
  # diagnostic, so Phase 8 criterion 2's wording is enforced by the tool rather
  # than by this job. The lint runs before the build so a documentation-accretion
  # failure is reported even when LaTeX would also fail. The byte-identity check
  # runs last, after the upload, so the first build's PDFs are still collected
  # for inspection when the digests disagree.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TeX Live and latexmk
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          latexmk biber
          texlive-latex-base texlive-latex-recommended texlive-latex-extra
          texlive-fonts-recommended texlive-bibtex-extra texlive-science
      - name: Install package (provides the `star docs` command)
        run: pip install .
      - name: Chapter-manifest lint (FR-29 accretion gate)
        run: python scripts/lint_chapters.py
      - name: Build both PDFs
        run: star docs
      - name: Assert both PDFs exist
        run: |
          test -f docs/mathlib/mathlib.pdf
          test -f docs/report/report.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: docs-pdfs
          path: |
            docs/mathlib/mathlib.pdf
            docs/report/report.pdf
          if-no-files-found: error
      - name: Assert two consecutive builds are byte-identical (criterion 2)
        # `star docs` already pins SOURCE_DATE_EPOCH to the HEAD commit time;
        # what the criterion additionally demands is that a second build
        # actually reproduces the first, so build it again and compare digests.
        # `latexmk -C` is used rather than `-c` because it removes the PDF as
        # well as the .aux/.fls/.fdb_latexmk state: a rebuild that resumed from
        # that state could re-emit the first PDF untouched and prove nothing.
        run: |
          # pipefail matters here: without it a failing sha256sum still yields
          # cut's zero status, and the digest silently becomes the empty string
          # -- two empty digests compare equal and the gate passes vacuously.
          set -euo pipefail
          first_mathlib=$(sha256sum docs/mathlib/mathlib.pdf | cut -d ' ' -f 1)
          first_report=$(sha256sum docs/report/report.pdf | cut -d ' ' -f 1)
          (cd docs/mathlib && latexmk -C)
          (cd docs/report && latexmk -C)
          for pdf in docs/mathlib/mathlib.pdf docs/report/report.pdf; do
            if [ -e "$pdf" ]; then
              echo "latexmk -C left $pdf in place; the rebuild would be incremental" >&2
              exit 1
            fi
          done
          star docs
          second_mathlib=$(sha256sum docs/mathlib/mathlib.pdf | cut -d ' ' -f 1)
          second_report=$(sha256sum docs/report/report.pdf | cut -d ' ' -f 1)
          echo "mathlib.pdf build 1: $first_mathlib"
          echo "mathlib.pdf build 2: $second_mathlib"
          echo "report.pdf  build 1: $first_report"
          echo "report.pdf  build 2: $second_report"
          status=0
          if [ "$first_mathlib" != "$second_mathlib" ]; then
            echo "docs/mathlib/mathlib.pdf differs between the two builds" >&2
            status=1
          fi
          if [ "$first_report" != "$second_report" ]; then
            echo "docs/report/report.pdf differs between the two builds" >&2
            status=1
          fi
          # Both comparisons report before the job fails, so one run names
          # every non-reproducible PDF rather than only the first.
          exit $status

  # Exit criterion 6: CITATION.cff validates against the CFF schema and the
  # README BibTeX block matches it field for field.
  citation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cffconvert
        run: pip install cffconvert
      - name: Validate CITATION.cff
        run: cffconvert --validate
      - name: Check README BibTeX consistency
        run: python scripts/check_citation.py

  # Phase 5 exit criterion 6, size half (FR-32): every platform wheel stays
  # under the 20 MB budget. Built with --no-deps because the budget measures
  # this project's artifact, not its dependency tree, and measured on all
  # four legs because the compiled core's size is platform-specific.
  wheel-budget:
    strategy:
      # All legs report even when one fails, so a platform-specific size
      # blowout is visible in a single CI round-trip.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the wheel
        run: pip wheel . --no-deps -w dist
      - name: Assert the wheel is under the 20 MB budget
        # Inline Python instead of shell arithmetic so the same step runs
        # identically on POSIX and Windows runners. Decimal megabytes (1 MB
        # = 1e6 B): the SI reading of FR-32's "20 MB", and the stricter one.
        shell: python
        run: |
          import pathlib
          import sys

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found: {wheels}")
          size = wheels[0].stat().st_size
          budget = 20 * 1000 * 1000
          print(f"{wheels[0].name}: {size} bytes = {size / 1e6:.2f} MB (budget: 20 MB)")
          if size >= budget:
              sys.exit(f"wheel exceeds the FR-32 budget: {size} >= {budget} bytes")

  # Phase 5 exit criterion 6, dependency half (FR-32): in a fresh venv, the
  # installed distribution set after installing the built wheel with NO
  # extras exactly equals the committed D-12 closure
  # (tests/golden/packaging/runtime_deps.toml), both directions. The wheel —
  # not an editable install — is what a user's pip resolves, so that is what
  # the gate audits. Run on all four legs (it is cheap) because the equality
  # gate would also catch a platform-conditional dependency sneaking into
  # the closure on one platform only.
  dep-minimality:
    strategy:
      # All legs report even when one fails, so a platform-specific
      # dependency drift is visible in a single CI round-trip.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the wheel
        run: pip wheel . --no-deps -w dist
      - name: Install the wheel into a fresh venv and audit the closure
        # bash on every leg so one script handles the bin/ (POSIX) versus
        # Scripts/ (Windows) venv layout split. check_min_deps.py runs WITH
        # the fresh venv's interpreter so importlib.metadata enumerates
        # exactly the environment under audit; the script is stdlib-only, so
        # the fresh venv needs no tooling beyond the wheel it is auditing.
        shell: bash
        run: |
          python -m venv fresh
          if [ -x fresh/bin/python ]; then VPY=fresh/bin/python; else VPY=fresh/Scripts/python; fi
          "$VPY" -m pip install --quiet dist/*.whl
          "$VPY" scripts/check_min_deps.py --expected tests/golden/packaging/runtime_deps.toml

  # Phase 8 exit criterion 3: the report case-study figures regenerate
  # bit-for-bit under the pinned matplotlib. verify_repro() renders each figure
  # twice to fresh temp dirs and asserts the two renders are byte-identical, so
  # the gate proves regeneration determinism on the runner without depending on
  # cross-platform PNG byte identity (matplotlib bundles a platform-specific
  # FreeType, so committed PNG bytes are toolchain- and platform-scoped by
  # design, exactly as the criterion's "pinned matplotlib" clause states).
  report-figures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and pin the figure toolchain
        # The bit-for-bit guarantee is against the matplotlib pinned in
        # scripts/figures/README.md; pin it explicitly so the gate measures that
        # toolchain rather than whatever floats in from the >= 3.8 floor.
        run: |
          pip install .
          pip install 'matplotlib==3.11.1'
      - name: Regenerate report figures and assert bit-for-bit reproducibility
        run: python scripts/figures/casestudy_figures.py --verify-repro

  # Phase 8 exit criterion 5: on a version tag, the four-platform wheels build
  # and each installs and passes `verify --quick`. cibuildwheel builds the
  # native wheel on each runner (manylinux x86-64 / aarch64, macOS arm64,
  # Windows x64 -- FR-32's four targets) and runs the smoke command in an
  # isolated venv per wheel; the wheels upload as release artifacts. Tag-only,
  # so ordinary branch pushes never pay the cibuildwheel cost.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      # All legs report even when one fails, so a platform-specific wheel or
      # smoke failure is visible in a single release round-trip.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and smoke-verify the wheels
        run: |
          pip install 'cibuildwheel>=2.16'
          python -m cibuildwheel --output-dir wheelhouse
        env:
          # 3.11 is the requires-python floor (A-1: tomllib); build through 3.13.
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          # FR-32 names manylinux; skip the musllinux variants to keep the
          # release set to the four stated targets.
          CIBW_SKIP: "*-musllinux*"
          # FR-32 names Windows x64, but cibuildwheel's Windows `auto` archs
          # are AMD64 *and* x86, so the default also builds 32-bit wheels this
          # project never targeted -- and they cannot install: matplotlib
          # publishes no win32 wheel, so pip fails resolving a declared runtime
          # dependency and the whole leg reds. Naming the arch is preferred to
          # adding *-win32 to CIBW_SKIP because it also excludes any future
          # arch cibuildwheel folds into `auto`.
          CIBW_ARCHS_WINDOWS: AMD64
          # Bare-install smoke (criterion 5): `star verify --quick` uses inlined
          # fixtures and needs no repo checkout, so it runs from cibuildwheel's
          # isolated test venv with only the wheel and its declared runtime
          # dependencies installed -- exactly a user's `pip install`.
          CIBW_TEST_COMMAND: "star verify --quick"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
