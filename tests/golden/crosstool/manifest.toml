#     body-centred ICRF system, so both tools start from identical numbers.
#
# Irreducible tool differences (bounded, recorded per case in the .script and
# below): GMAT's Mars/Moon body-fixed orientation vs the simulator's analytic
# IAU 2015 Mars elements and DE440 Moon principal-axis frame; these are the
# Phase 8 analogue of the Phase 3 FK5/IAU-76-vs-CIO residual, expected far
# below each 100 m / 1 km / 100 km gate.

