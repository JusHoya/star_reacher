#   XTOOL-MOLNIYA-GMAT       missions/molniya.toml        RMS < 100 m / 7 d
#   XTOOL-LUNAR-GMAT         missions/lunar_orbiter.toml  RMS < 100 m / 7 d
#   XTOOL-MARS-ORBITER-GMAT  missions/mars_orbiter.toml   RMS < 100 m / 7 d
#   XTOOL-TRANSLUNAR-GMAT    missions/tli.toml coast      < 1 km at lunar arrival
#   XTOOL-MARS-CRUISE-GMAT   missions/mars_cruise.toml    < 100 km at arrival
#
# Toolchain provenance: identical to the Phase 3 block above (GMAT R2026a
# portable, pinned SHA-256 F7B00BDE...; stock startup file and EOP pins as
# recorded there). The Earth-regime cases (Molniya, trans-lunar) reuse the same
# gmat_startup_zeroeop.txt zero-EOP override committed above; the Moon-, Mars-,
# and Sun-centred cases use body-centred ICRF coordinate systems whose
# orientation the Earth-EOP convention does not touch.
#
# Controlled-comparison configuration (per case, in the .script headers):
#   * Identical (GM, R, coefficients) fields: Molniya/trans-lunar read the
#     committed earth_egm2008_8x8.cof (Molniya) or point-mass Earth
#     (trans-lunar); the lunar case reads moon_grgm1200a_50x50.cof and the
#     Mars case mars_mro120f_20x20.cof, both generated below from the same
#     committed coefficient excerpts the missions load, each with its own
#     self-consistent GM/R triple.
#   * SRP where the mission carries it (Mars orbiter, lunar orbiter, Mars
#     cruise): GMAT spherical (cannonball) SRP with Cr and area chosen so
#     Cr*A/m equals the mission's cr_a_over_m_m2pkg; the SRP flux/AU are stated
#     in each .script and matched to the simulator's SRP constants.
#   * Fixed-step RK89 at 60 s (ErrorControl None) so report rows land on the
